<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Netflix Navigation</title>
    <link rel="stylesheet" href="./style.css" />
    <script defer src="./script.js"></script>
  </head>
  <body>
    <div class="full-screen">
      <img src="./images/burger-bar.png" alt="menu-button" class="menu-img" />
      <div class="side-navigation">
        <div class="black-container nav-container"></div>
        <div class="red-container nav-container"></div>
        <div class="white-container nav-container">
          <div class="white-container-content">
            <img src="./images/delete.png" alt="" class="close-img" />
            <img
              src="./images/Netflix-Logo.wine.png"
              alt=""
              class="Netflix-Logo"
            />
            <div>
              <ul class="nav-list-items">
                <li><a href="#">Teams</a></li>
                <li><a href="#">Locations</a></li>
                <li><a href="#">Life At Netflix</a></li>
                <ul class="nested-list">
                  <li><a href="#">Netflix Culture Memo</a></li>
                  <li><a href="#">Work Life Balance</a></li>
                  <li><a href="#">Inclusion & diversity</a></li>
                  <li><a href="#">Blog</a></li>
                </ul>
              </ul>
            </div>
          </div>
        </div>
      </div>
      <div class="logo-container">
        <img
          src="./images/Netflix-Logo.wine.png"
          alt="Netflix-Logo"
          class="Netflix-Logo"
        />
        <p class="logo-text">Mobile Navigation</p>
      </div>
    </div>
  </body>
</html>
