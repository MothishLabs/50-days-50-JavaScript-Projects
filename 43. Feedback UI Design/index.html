<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
    <script defer src="./script.js"></script>
    <title>User feedBack</title>
  </head>
  <body>
    <div class="ui">
      <div class="container feedback-container">
        <p class="heading-container">
          How satisified are you with our customer support performance?
        </p>

        <div class="emoji-container">
          <div class="emoji-box active-emoji">
            <img src="./images/emot.png" alt="happy face emoji" />
            <p>Satisified</p>
          </div>
          <div class="emoji-box">
            <img src="./images/confused.png" alt="neutral face emoji" />
            <p>Neutral</p>
          </div>
          <div class="emoji-box">
            <img src="./images/sad-face.png" alt="sad face emoji" />
            <p>Unhappy</p>
          </div>
        </div>

        <button class="btn">Send Review</button>
      </div>

      <div class="container feedback-report-container">
        <div class="heart-container">
          <img src="./images/heart (1).png" alt="heart-img" />
          <p>Thank You!</p>
        </div>

        <h3>FeedBack : <span class="feedback-report"></span></h3>

        <p class="feedback-report-footer">
          We'll use your feedback to improve our customer support
        </p>
      </div>
    </div>
  </body>
</html>
