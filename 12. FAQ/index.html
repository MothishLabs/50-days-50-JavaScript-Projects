<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
    <script defer src="./script.js"></script>
    <title>Document</title>
  </head>
  <body>
    <div class="landing-page-container">
      <div class="center-content">
        <h1>Frequently Asked Questions</h1>
        <div class="QA-container">
          <div class="QA-layout">
            <div class="question-block">
              <p>1. Captial Of India?</p>
              <div class="right-space">
                <button class="plus-btn">+</button>
                <button class="minus-btn btn-hide">-</button>
              </div>
            </div>
            <div class="answer-block">
              <p>New Delhi</p>
            </div>
          </div>

          <div class="QA-layout">
            <div class="question-block">
              <p>2. National Bird Of India?</p>
              <div class="right-space">
                <button class="plus-btn">+</button>
                <button class="minus-btn btn-hide">-</button>
              </div>
            </div>
            <div class="answer-block">
              <p>Peacock</p>
            </div>
          </div>

          <div class="QA-layout">
            <div class="question-block">
              <p>3. How Many Trophy Won By Rcb Franchice?</p>
              <div class="right-space">
                <button class="plus-btn">+</button>
                <button class="minus-btn btn-hide">-</button>
              </div>
            </div>
            <div class="answer-block">
              <p>Three cup's</p>
            </div>
          </div>

          <div class="QA-layout">
            <div class="question-block">
              <p>4. Captial City Of TamilNadu?</p>
              <div class="right-space">
                <button class="plus-btn">+</button>
                <button class="minus-btn btn-hide">-</button>
              </div>
            </div>
            <div class="answer-block">
              <p>Chennai</p>
            </div>
          </div>

          <div class="QA-layout">
            <div class="question-block">
              <p>5. Abbrivation Of Ai?</p>
              <div class="right-space">
                <button class="plus-btn">+</button>
                <button class="minus-btn btn-hide">-</button>
              </div>
            </div>
            <div class="answer-block">
              <p>Artificial Intelligence</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
