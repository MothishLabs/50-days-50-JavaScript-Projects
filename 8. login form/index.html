<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
    <title>Document</title>
  </head>
  <body>
    <div class="form-container">
      <form class="center-form-container">
        <div>
          <h2 class="">Sign in</h2>
        </div>
        <div>
          <label for="Email">Email</label>
          <input
            type="text"
            id="Email"
            placeholder="abc@gmail.com"
            name="Email"
            required
          />
        </div>
        <div>
          <label for="Email-pass">Password</label>
          <input
            type="password"
            id="Email-pass"
            name="Email_password"
            required
          />
        </div>
        <button class="btn">Submit</button>
        <div>
          <p>Don't Have An Account? <a href="#">Create Account</a></p>
        </div>
      </form>
    </div>
  </body>
</html>
