<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
    <script defer src="./script.js"></script>
    <title>Document</title>
  </head>
  <body>
    <div class="container">
      <h2>Double Click On The Image To 💗 It</h2>
      <p>You Liked It <span class="times-liked">0</span> Times</p>
      <div class="cat-container">
        <img src="./images/cat.jpeg" alt="cat image" class="cat-img" />
        <div class="heart-placement">
          <img
            src="./images/heart.png"
            alt="heart image"
            class="active heart-img-animation"
          />
        </div>
      </div>
    </div>
  </body>
</html>
