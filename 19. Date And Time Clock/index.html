<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
    <script defer src="./script.js"></script>
    <title>Document</title>
  </head>
  <body>
    <div class="container">
      <button class="btn-style black-btn">Turn On Dark Mode</button>
      <div>
        <h1 class="timer">
          <p class="hour"></p>
          <p>:</p>
          <p class="minute"></p>
        </h1>
        <div class="upper">
          <p><span class="day"></span></p>
          <p><span class="month"></span></p>
          <p><span class="date"></span></p>
        </div>
      </div>
    </div>
  </body>
</html>
