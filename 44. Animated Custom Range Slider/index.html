<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Animated Custom Range Slider</title>
    <link rel="stylesheet" href="./style.css" />
    <script defer src="./script.js"></script>
  </head>
  <body>
    <h1 class="header">Animated Custom Range Slider</h1>
    <div class="container">
      <div class="slider-range-indicator-container">
        <div class="slider-range-indicator">
          <span class="range-number">30</span>
        </div>
      </div>
      <form>
        <input
          type="range"
          min="0"
          max="100"
          value="30"
          name="range_value"
          class="range-slider"
        />
      </form>
    </div>
  </body>
</html>
